
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NewsApp PWA | Noticias de actualidad</title>

  <meta name="description" content="Mantente informado con las noticias de actualidad de NewsApp.">
  <meta name="theme-color" content="#14213d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NewsApp">

  <link rel="manifest" href="../manifest.json">
  <link rel="apple-touch-icon" href="../icons/noticias-192.png">
  <link rel="icon" type="image/png" href="../icons/noticias-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="../style.css">

  <style>
    :root {
      --news-primary: #14213d;
      --news-accent: #2563eb;
      --news-accent-light: #eff6ff;
      --news-background: #f5f7fb;
      --news-surface: #ffffff;
      --news-text: #182230;
      --news-muted: #687386;
      --news-border: #e5eaf2;
      --news-radius: 18px;
      --news-shadow: 0 8px 28px rgba(20, 33, 61, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    body.api-page {
      margin: 0;
      background: var(--news-background);
      color: var(--news-text);
      font-family: "Inter", sans-serif;
      min-height: 100vh;
    }

    .api-page button,
    .api-page a {
      -webkit-tap-highlight-color: transparent;
    }

    /* Encabezado */
    .api-page .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--news-border);
    }

    .api-page .header-container {
      width: min(1200px, 92%);
      min-height: 76px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .api-page .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .api-page .brand-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 21px;
      border-radius: 14px;
      background: linear-gradient(135deg, #14213d, #2563eb);
      box-shadow: 0 5px 14px rgba(37, 99, 235, 0.2);
    }

    .api-page .brand-title {
      margin: 0;
      color: var(--news-primary);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .api-page .badge-pwa {
      display: inline-block;
      margin-left: 4px;
      padding: 4px 7px;
      border-radius: 6px;
      background: var(--news-accent-light);
      color: var(--news-accent);
      font-size: 10px;
      letter-spacing: 0;
      vertical-align: middle;
    }

    .api-page .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .api-page .btn {
      min-height: 42px;
      border: 1px solid var(--news-border);
      border-radius: 12px;
      padding: 0 15px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .api-page .btn:hover {
      transform: translateY(-2px);
    }

    .api-page .btn-notify {
      background: var(--news-primary);
      color: white;
      border-color: var(--news-primary);
    }

    .api-page .btn-secondary {
      width: 44px;
      padding: 0;
      background: white;
      color: var(--news-primary);
      font-size: 16px;
    }

    /* Navegación principal */
    .api-page .app-nav {
      background: white;
      border-bottom: 1px solid var(--news-border);
    }

    .api-page .nav-container {
      width: min(1200px, 92%);
      min-height: 52px;
      margin: auto;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .api-page .nav-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      height: 52px;
      color: var(--news-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.2s;
    }

    .api-page .nav-link:hover,
    .api-page .nav-link.active {
      color: var(--news-accent);
    }

    .api-page .nav-link.active::after {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 3px;
      border-radius: 3px 3px 0 0;
      background: var(--news-accent);
      content: "";
    }

    /* Contenido */
    .api-page .app-main {
      width: min(1200px, 92%);
      min-height: 60vh;
      margin: 0 auto;
      padding: 38px 0 55px;
    }

    .api-page .content-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 24px;
    }

    .api-page .content-header h2 {
      margin: 0;
      color: var(--news-primary);
      font-size: clamp(25px, 3vw, 34px);
      font-weight: 800;
      letter-spacing: -1.2px;
    }

    .api-page .content-header h2::after {
      display: block;
      width: 46px;
      height: 4px;
      margin-top: 12px;
      border-radius: 4px;
      background: var(--news-accent);
      content: "";
    }

    .api-page .news-count {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border: 1px solid var(--news-border);
      border-radius: 30px;
      background: white;
      color: var(--news-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .api-page .news-count::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      content: "";
    }

    /* Categorías */
    .api-page .category-bar {
      margin: 0;
      padding: 15px 0;
      background: transparent;
    }

    .api-page .category-container {
      width: min(1200px, 92%);
      margin: auto;
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 2px 0 8px;
      scrollbar-width: thin;
    }

    .api-page .nav-pill {
      flex: 0 0 auto;
      padding: 11px 17px;
      border: 1px solid var(--news-border);
      border-radius: 30px;
      background: white;
      color: #526075;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .api-page .nav-pill:hover {
      border-color: #9bbcff;
      color: var(--news-accent);
      background: var(--news-accent-light);
    }

    .api-page .nav-pill.active {
      border-color: var(--news-accent);
      background: var(--news-accent);
      color: white;
      box-shadow: 0 5px 12px rgba(37, 99, 235, 0.2);
    }

    /* Aviso sin conexión */
    .api-page .offline-banner:not(.hidden) {
      width: min(1200px, 92%);
      margin: 10px auto;
      padding: 13px 16px;
      border: 1px solid #f3d28b;
      border-radius: 12px;
      background: #fff8e6;
      color: #8a5b08;
      font-size: 13px;
    }

    /* Cuadrícula de noticias */
    .api-page .news-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .api-page .news-card,
    .api-page .article-card,
    .api-page .news-item {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--news-border);
      border-radius: var(--news-radius);
      background: var(--news-surface);
      box-shadow: var(--news-shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .api-page .news-card:hover,
    .api-page .article-card:hover,
    .api-page .news-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 34px rgba(20, 33, 61, 0.12);
    }

    .api-page .news-card img,
    .api-page .article-card img,
    .api-page .news-item img {
      display: block;
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #e8edf5;
    }

    .api-page .news-card-content,
    .api-page .article-content,
    .api-page .news-item-content {
      padding: 20px;
    }

    .api-page .news-card h3,
    .api-page .article-card h3,
    .api-page .news-item h3 {
      margin: 12px 0 10px;
      color: var(--news-primary);
      font-size: 17px;
      line-height: 1.5;
      font-weight: 700;
    }

    .api-page .news-card p,
    .api-page .article-card p,
    .api-page .news-item p {
      color: var(--news-muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .api-page .news-card a,
    .api-page .article-card a,
    .api-page .news-item a {
      color: var(--news-accent);
      font-weight: 700;
      text-decoration: none;
    }

    .api-page .news-card a:hover,
    .api-page .article-card a:hover,
    .api-page .news-item a:hover {
      text-decoration: underline;
    }

    .api-page .loading-state,
    .api-page .error-state,
    .api-page .empty-state {
      grid-column: 1 / -1;
      padding: 55px 20px;
      border: 1px dashed #cbd5e1;
      border-radius: var(--news-radius);
      background: white;
      color: var(--news-muted);
      text-align: center;
    }

    .api-page .spinner {
      width: 38px;
      height: 38px;
      margin: 0 auto 18px;
      border: 4px solid #e5edff;
      border-top-color: var(--news-accent);
      border-radius: 50%;
      animation: news-spin 0.8s linear infinite;
    }

    @keyframes news-spin {
      to { transform: rotate(360deg); }
    }

    /* Pie de página */
    .api-page .app-footer {
      border-top: 1px solid var(--news-border);
      background: white;
    }

    .api-page .footer-container {
      width: min(1200px, 92%);
      margin: auto;
      padding: 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 20px;
    }

    .api-page .footer-container p {
      margin: 0;
      color: var(--news-muted);
      font-size: 11px;
      line-height: 1.7;
    }

    .api-page .api-attribution a {
      color: var(--news-accent);
      font-weight: 700;
      text-decoration: none;
    }

    @media (max-width: 900px) {
      .api-page .news-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
      }

      .api-page .news-card img,
      .api-page .article-card img,
      .api-page .news-item img {
        height: 190px;
      }
    }

    @media (max-width: 600px) {
      .api-page .header-container {
        min-height: 66px;
      }

      .api-page .brand-icon {
        width: 39px;
        height: 39px;
        font-size: 18px;
      }

      .api-page .brand-title {
        font-size: 19px;
      }

      .api-page .btn-notify {
        width: 42px;
        padding: 0;
      }

      .api-page .btn-notify .btn-text {
        display: none;
      }

      .api-page .header-actions {
        gap: 7px;
      }

      .api-page .nav-container {
        gap: 22px;
      }

      .api-page .app-main {
        padding-top: 28px;
      }

      .api-page .content-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .api-page .news-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .api-page .news-card img,
      .api-page .article-card img,
      .api-page .news-item img {
        height: 220px;
      }

      .api-page .footer-container {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .api-page *,
      .api-page *::before,
      .api-page *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    
    /* Tarjetas de noticias: estructura y distribución */
    .api-page .news-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .api-page .news-image-wrapper {
      height: 210px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: #eaf0fa;
      color: #7890b5;
      font-size: 38px;
    }

    .api-page .news-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.35s ease;
    }

    .api-page .news-card:hover .news-image-wrapper img {
      transform: scale(1.04);
    }

    .api-page .news-image-wrapper.no-image {
      height: 150px;
      background: linear-gradient(135deg, #eaf0fa, #f7f9fd);
    }

    .api-page .news-card-content {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 20px;
    }

    .api-page .news-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .api-page .news-category {
      padding: 6px 9px;
      border-radius: 6px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .api-page .news-date {
      color: #7b8798;
      font-size: 10px;
    }

    .api-page .news-card .news-title {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      min-height: 0;
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .api-page .news-card .news-description {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 4;
      margin: 0 0 22px;
      color: #687386;
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .api-page .news-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: auto;
      padding-top: 15px;
      border-top: 1px solid #edf0f5;
    }

    .api-page .news-source {
      max-width: 55%;
      overflow-wrap: anywhere;
      color: #7b8798;
      font-size: 11px;
    }

    .api-page .news-source i {
      margin-right: 4px;
    }

    .api-page .news-card .news-read-more {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      .api-page .news-image-wrapper {
        height: 220px;
      }

      .api-page .news-card-content {
        padding: 17px;
      }
    }

  </style>
</head>

<body class="api-page">

  <header class="app-header">
    <div class="header-container">
      <a href="../index.html" class="brand"
         style="text-decoration:none" aria-label="NewsApp, ir al inicio">
        <span class="brand-icon">
          <i class="fa-solid fa-newspaper"></i>
        </span>
        <h1 class="brand-title">
          NewsApp <span class="badge-pwa">PWA</span>
        </h1>
      </a>

      <div class="header-actions">
        <button id="btn-notify" class="btn btn-notify"
                title="Activar notificaciones" aria-label="Activar notificaciones">
          <span class="icon"><i class="fa-solid fa-bell"></i></span>
          <span class="btn-text">Notificaciones</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="app-nav" aria-label="Navegación principal">
    <div class="nav-container">
      <a href="../index.html" class="nav-link">
        <i class="fa-solid fa-house"></i> Inicio
      </a>

      <a href="./api.html" class="nav-link active" aria-current="page">
        <i class="fa-solid fa-newspaper"></i> Noticias
      </a>
    </div>
  </nav>

  <div class="category-bar">
    <div class="category-container" aria-label="Filtrar noticias por categoría">
      <button class="nav-pill active" data-category="general" aria-pressed="true">
        <i class="fa-solid fa-globe"></i> General
      </button>
      <button class="nav-pill" data-category="business" aria-pressed="false">
        <i class="fa-solid fa-chart-line"></i> Negocios
      </button>
      <button class="nav-pill" data-category="technology" aria-pressed="false">
        <i class="fa-solid fa-microchip"></i> Tecnología
      </button>
      <button class="nav-pill" data-category="sports" aria-pressed="false">
        <i class="fa-solid fa-futbol"></i> Deportes
      </button>
      <button class="nav-pill" data-category="entertainment" aria-pressed="false">
        <i class="fa-solid fa-film"></i> Entretenimiento
      </button>
      <button class="nav-pill" data-category="science" aria-pressed="false">
        <i class="fa-solid fa-flask"></i> Ciencia
      </button>
    </div>
  </div>

  <div id="offline-banner" class="offline-banner hidden" role="status">
    <i class="fa-solid fa-triangle-exclamation"></i>
    Estás navegando sin conexión. Se mostrarán las noticias guardadas, si existen.
  </div>

  <main class="app-main">
    <section class="content-header">
      <div>
        <h2 id="section-title">Últimas noticias</h2>
      </div>

      <span id="news-count" class="news-count" aria-live="polite">
        Cargando noticias...
      </span>
    </section>

    <section id="news-container" class="news-grid"
             aria-label="Noticias disponibles" aria-live="polite">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Buscando las noticias más recientes...</p>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-container">
      <p>&copy; 2026 NewsApp PWA · IDGS 104</p>
      <p class="api-attribution">
        Noticias proporcionadas por
        <a href="https://gnews.io/" target="_blank" rel="noopener noreferrer">
          GNews
        </a>
      </p>
    </div>
  </footer>

  <script src="../app.js"></script>
</body>
</html>
